             vacant: !!opts.vacant, children: opts.children || [], link: opts.link || null };
  }
  // L: a node whose headcount is computed live from another department's tree,
  // instead of being typed in manually. deptId = tab to pull from; matchName (optional) =
  // only count what's under a specific box inside that tab (e.g. "Body Section" inside PDI).
  function L(name, role, deptId, matchName){
    return N(name, role, { link: { deptId: deptId, matchName: matchName || null, openTab: deptId } });
  }

  // ---------- dynamic counting for linked/summary nodes ----------
  function countTree(node){
    return 1 + (node.children || []).reduce((s,c) => s + countTree(c), 0);
  }
  function countChildrenOnly(node){
    return (node.children || []).reduce((s,c) => s + countTree(c), 0);
  }
  function findNodeByName(node, name){
    if (node.name && node.name.toLowerCase().indexOf(name.toLowerCase()) !== -1) return node;
    for (const c of (node.children || [])) {
      const r = findNodeByName(c, name);
      if (r) return r;
    }
    return null;

    if (node.link) {
      if (node.link.summaryNode) return getDynamicCount(node.link.summaryNode);

      if (node.link.matchName) {
        const target = findNodeByName(dept.tree, node.link.matchName);
        return target ? countChildrenOnly(target) : 0;
      }
      return countTree(dept.tree);
    }
    return 1 + (node.children || []).reduce((s,c) => s + getDynamicCount(c), 0);

  // ---------- tree utilities ----------
  function findNode(node, id){
    if (node.id === id) return node;
    for (const c of node.children){
      const r = findNode(c, id);
      if (r) return r;
    }
    return null;
  }
  function findParent(node, id, parent){
    if (node.id === id) return parent;
    for (const c of node.children){
      const r = findParent(c, id, node);
      if (r !== undefined && r !== null) return r;
    }
    return null;
  }

  function escapeHtml(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  let isFitScreen = true;

  function autoFitFonts() {
    const fontMult = parseFloat(getComputedStyle(root).getPropertyValue('--font-mult')) || 1;
    root.querySelectorAll('.node-card').forEach(card => {
      const texts = card.querySelectorAll('[contenteditable="true"]');
      texts.forEach(t => {
        if (!t.dataset.origSize) {
          t.dataset.origSize = window.getComputedStyle(t).fontSize;
        }
        t.style.fontSize = (parseFloat(t.dataset.origSize) * fontMult) + 'px';
      });
      
      let attempts = 0;
      while (card.scrollHeight > card.clientHeight && attempts < 15) {
        texts.forEach(t => {
          let current = parseFloat(t.style.fontSize);
          if (current > 7) {
            t.style.fontSize = (current - 0.5) + 'px';
          }
        });
        attempts++;
      }
    });
  }

  function renderNode(node, isRoot, depth = 0){

          <span class="n-note" contenteditable="true" data-field="note" data-id="${node.id}" placeholder="Area">${escapeHtml(node.note || '')}</span>
          ${isDiv ? `<span class="n-target" contenteditable="true" data-field="target" data-id="${node.id}" placeholder="Sales Tgt-       , Colle- Tgt-      ">${escapeHtml(node.target || '')}</span>` : ''}
          <span class="node-btns">

          </span>
        </div>
        ${node.children && node.children.length ? `<ul${ulClass}>${node.children.map(c => renderNode(c, false, depth + 1)).join('')}</ul>` : ''}
      </li>
    `;
  }

  function updateLiveCounts() {
    function countSubtree(n) {
      if (n.noCount) return 0;
      let c = 1;
      (n.children || []).forEach(child => { c += countSubtree(child); });
      return c;
    }
    function getTargetCount(deptId, matchName) {
      const targetDept = DEPTS.find(d => d.id === deptId);
      if (!targetDept) return 0;
      let targetNode = targetDept.tree;
      if (matchName) {
        const q = [targetNode];
        targetNode = null;
        while(q.length){
          const curr = q.shift();
          if (curr.name === matchName) { targetNode = curr; break; }
          (curr.children || []).forEach(c => q.push(c));
        }
      }
      return targetNode ? countSubtree(targetNode) : 0;
    }
    function updateNode(node) {
      let count = null;
      if (node.link && node.link.deptId) {
        count = getTargetCount(node.link.deptId, node.link.matchName);
      } else if (node.name === 'SALES' && node.link && node.link.summaryNode) {
        count = getTargetCount('salessummary');
      }
      if (count !== null) {
        const regex = /\(\d+\)/;
        if (node.role && regex.test(node.role)) {
          node.role = node.role.replace(regex, `(${count})`);
        } else if (node.name && regex.test(node.name)) {
          node.name = node.name.replace(regex, `(${count})`);
        }
      }
      (node.children || []).forEach(updateNode);
    }
    
    const topSum = DEPTS.find(d => d.id === 'salessupport');
    if (topSum) {
      updateNode(topSum.tree);
      let total = 0;
      ['div1','div2','div3','div4','techsupport','specialtask','collresale','marketing','salesadmin','pdi','cvplant'].forEach(id => {
        total += getTargetCount(id);
      });
      const hodNode = topSum.tree.children[0];
      if (hodNode && hodNode.role && /\(\d+\)/.test(hodNode.role)) {
        hodNode.role = hodNode.role.replace(/\(\d+\)/, `(${total})`);
      }
    }
    
    const sSum = DEPTS.find(d => d.id === 'salessummary');
    if (sSum) {
      updateNode(sSum.tree);
    }
  }

  function getCounts(dId) {
    let counts = { divMgr: 0, am: 0, su: 0 };
    const dObj = DEPTS.find(d => d.id === dId);
    if (!dObj) return counts;

    function traverse(node, depth) {
      if (node.noCount) return;
      if (dId.startsWith('div')) {
        if (depth === 0) counts.divMgr++;
        else if (depth === 1) counts.am++;
        else counts.su++;
      } else if (dId === 'techsupport' || dId === 'specialtask') {
        counts.am++;
      } else if (dId === 'collresale') {
        if (depth <= 2) counts.am++;
        else counts.su++;
      }
      (node.children || []).forEach(c => traverse(c, depth + 1));
    }
    traverse(dObj.tree, 0);
    return counts;
  }

  function onEditBlur(e){

      if (!DEPTS[activeDept].stats) {

        };
      }
      DEPTS[activeDept].stats[parts[0]][parts[1]] = el.textContent.trim();
      render();
      return;
    }

    const id = el.dataset.id;
    const field = el.dataset.field;
    const text = el.textContent.trim();
    const node = findNode(DEPTS[activeDept].tree, id);
    if (!node) return;
    if (field === 'name') {
      node.name = text;
      if (text.toLowerCase() === 'vacant') node.vacant = true;
      render();
    } else if (field === 'role') {
      node.role = text;
      render();
    } else if (field === 'note') {
      node.note = text;
      render();
    } else if (field === 'target') {
      node.target = text;
      render();
    }
  }

  function onButtonClick(e){
    const el = e.currentTarget;
    const action = el.dataset.action;

    if (action === 'toggle-fit') {
      isFitScreen = !isFitScreen;
      render();
      return;
    }
    if (action === 'zoom-in') {
      const current = parseInt(getComputedStyle(root).getPropertyValue('--node-w')) || 120;
      root.style.setProperty('--node-w', Math.min(300, current + 15) + 'px');
      return;
    }
    if (action === 'zoom-out') {
      const current = parseInt(getComputedStyle(root).getPropertyValue('--node-w')) || 120;
      root.style.setProperty('--node-w', Math.max(80, current - 15) + 'px');
      return;
    }

    if (action === 'switch-tab') {
      activeDept = parseInt(el.dataset.idx, 10);
      render();
      return;
    }
    if (action === 'theme') {
      const t = DEPTS[activeDept].theme || {};
      document.getElementById('inp-w').value = parseFloat(t.w || 120);
      document.getElementById('inp-f').value = parseFloat(t.f || 1);
      document.getElementById('inp-bg').value = t.bg || '#ffffff';
      document.getElementById('inp-ink').value = t.ink || '#1c2530';
      document.getElementById('inp-vac').value = t.vac || '#b7dfb0';
      document.getElementById('inp-line').value = t.line || '#c9c2b4';
      document.getElementById('inp-paper').value = t.paper || '#f6f5f1';
      document.getElementById('theme-dialog').showModal();
      return;
    }
    if (action === 'save') {
      localStorage.setItem('rml_org_depts', JSON.stringify(DEPTS));
      alert("Changes saved locally! Next time you open this file in this browser, your changes will be loaded automatically.");
      return;
    }
    if (action === 'print') { window.print(); return; }
    if (action === 'export') {
      const dataStr = JSON.stringify(DEPTS[activeDept].tree, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = DEPTS[activeDept].id + '_organogram.json'; a.click();
      URL.revokeObjectURL(url);
      return;
    }

    const id = el.dataset.id;
    const tree = DEPTS[activeDept].tree;
    const node = findNode(tree, id);
    if (!node) return;

    if (action === 'toggle-vacant') {
      node.vacant = !node.vacant;
      render();
    } else if (action === 'add-child') {
      node.children.push(N('New Position', ''));
      render();
    } else if (action === 'add-note') {
      if (!node.note) node.note = 'note';
      render();
    } else if (action === 'remove-node') {
      if(!confirm('Are you sure you want to remove this node and all its reports?')) return;
      const dept = DEPTS[activeDept];
      const p = findParent(dept.tree, id, null);
      if(p && p.children) {
        p.children = p.children.filter(c => c.id !== id);
        render();
      }
      return;
    } else if (action === 'undo') {
      performUndo();
      return;
    }
  }

            supportTree.children[0].children[0].link.summaryNode = salesSumTree;
          }
          
          // --- MIGRATION: Force update Div-1 from hardcoded data if it's outdated in Firebase ---
          const div1 = parsed.find(d => d.id === 'div1');
          if (div1 && localStorage.getItem('div1_migrated_v3') !== 'true') {
            div1.tree = JSON.parse(JSON.stringify(deptDiv1));
            localStorage.setItem('div1_migrated_v3', 'true');
            
            setTimeout(() => {
              if (window.firebase) {
                firebase.database().ref('organogram/depts').set(JSON.stringify(parsed));
              }
            }, 2000);
          }
          
          const div2 = parsed.find(d => d.id === 'div2');
          if (div2 && localStorage.getItem('div2_migrated_v1') !== 'true') {
            div2.tree = JSON.parse(JSON.stringify(deptDiv2));
            localStorage.setItem('div2_migrated_v1', 'true');
            
            setTimeout(() => {
              if (window.firebase) {
                firebase.database().ref('organogram/depts').set(JSON.stringify(parsed));
              }
            }, 2500);
          }
          // ----------------------------------------------------------------------------------------

          DEPTS = parsed;
          lastSavedStr = JSON.stringify(DEPTS);
          
          const activeEl = document.activeElement;
          const isTyping = activeEl && activeEl.hasAttribute('contenteditable');
          if (!isTyping) {
            render(true); // Render from remote, don't trigger autoSaveLocal
          }
        } catch(e) {
          console.error("Failed to parse Firebase data", e);
        }
      }
    });
  }
  render();
  isInitialLoad = false;
})();
</script>
